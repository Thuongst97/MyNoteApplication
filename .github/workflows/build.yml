name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No signing certificates yet: Windows is unsigned, macOS is ad-hoc signed
          # (identity "-" in electron-builder.json). Add CSC_LINK / CSC_KEY_PASSWORD
          # (and Apple notarization secrets) here to sign properly.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS signatures
        if: runner.os == 'macOS'
        run: |
          for app in dist_electron/mac*/NotionClone.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier|Format"
            lipo -archs "$app/Contents/MacOS/NotionClone"
          done
      - uses: actions/upload-artifact@v5
        with:
          name: NotionClone-${{ matrix.os }}
          path: |
            dist_electron/*.exe
            dist_electron/*.dmg
            dist_electron/*.zip
          if-no-files-found: error
