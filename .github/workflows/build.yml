name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    # New release notes on this branch publish a release (see the last step).
    branches: ['claude/sharp-brown-grboj6']
    paths: ['release-notes/**']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # create the GitHub release for version tags
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          # No signing certificates yet: Windows is unsigned, macOS is ad-hoc signed
          # (identity "-" in electron-builder.json). Add CSC_LINK / CSC_KEY_PASSWORD
          # (and Apple notarization secrets) here to sign properly.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS signatures
        if: runner.os == 'macOS'
        run: |
          for app in dist_electron/mac*/PremiumNote.app; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier|Format"
            lipo -archs "$app/Contents/MacOS/PremiumNote"
          done
      - name: Verify Windows app icon
        if: runner.os == 'Windows'
        shell: bash
        run: |
          node scripts/verify-win-icon.cjs dist_electron/win-unpacked/PremiumNote.exe
          # Also check the exe users actually get, from inside the installer.
          7z x -y -o_inst dist_electron/PremiumNote-Setup-*.exe '$PLUGINSDIR/app-64.7z' > /dev/null
          7z x -y -o_inst/app '_inst/$PLUGINSDIR/app-64.7z' > /dev/null
          node scripts/verify-win-icon.cjs _inst/app/PremiumNote.exe
          test -f _inst/app/resources/icon.ico && echo "OK   resources/icon.ico shipped"
      - uses: actions/upload-artifact@v5
        with:
          name: PremiumNote-${{ matrix.os }}
          path: |
            dist_electron/*.exe
            dist_electron/*.dmg
            dist_electron/*.zip
          if-no-files-found: error
      # Publishing: a version tag (v1.2.3), or new release notes pushed to the branch, creates
      # the GitHub release v<package.json version> with the Windows installer and the notes
      # from release-notes/<tag>.md. (The tag is created by GitHub if it doesn't exist.)
      - name: Release tag
        id: tag
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then tag="$GITHUB_REF_NAME"; else tag="v$(node -p "require('./package.json').version")"; fi
          test -f "release-notes/$tag.md" || { echo "::error::release-notes/$tag.md is missing"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release (Windows)
        if: steps.tag.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PremiumNote ${{ steps.tag.outputs.tag }}
          body_path: release-notes/${{ steps.tag.outputs.tag }}.md
          files: |
            dist_electron/*.exe
          make_latest: true
