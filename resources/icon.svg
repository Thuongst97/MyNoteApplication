<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5DEA5"/>
      <stop offset="1" stop-color="#EFD493"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Body: warm sand rounded square -->
  <rect x="72" y="72" width="880" height="880" rx="196" fill="url(#bg)"/>
  <rect x="72.5" y="72.5" width="879" height="879" rx="195.5" fill="none" stroke="#000" stroke-opacity="0.06"/>
  <!-- Letter N (muted bronze) -->
  <path d="M232 812 V214 H352 L628 618 V214 H748 V812 H628 L352 408 V812 Z" fill="#B3955A"/>
  <!-- Blue check badge -->
  <g filter="url(#shadow)">
    <circle cx="748" cy="770" r="114" fill="#1F7FD9"/>
  </g>
  <path d="M694 772 L732 810 L804 735" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
